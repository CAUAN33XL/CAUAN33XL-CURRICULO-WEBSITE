projects:
  - name: 33XL SYSTEM (WEBSITE OFICIAL)
    description: O site oficial da minha marca e ecossistema, que centraliza todas
      as minhas bases. Um atestado claro da minha capacidade de criar,
      estruturar e gerenciar infraestruturas digitais complexas de forma
      totalmente autônoma.
    technologies:
      - TypeScript
      - React
      - Branding
      - System Architecture
    link: https://33xl-system-website.vercel.app/
  - name: REPO ACCESS MANAGER (R.A.M)
    description: O núcleo central de acesso e indexação de todos os meus
      repositórios (públicos e privados) e websites. Um hub de portfólio
      desenvolvido com estética retro-punk para uma mente distribuída.
    technologies:
      - TypeScript
      - React
    link: https://repo-access-manager.vercel.app/
  - name: HYDROPUSH APP
    description: Aplicativo unificando implementações (Capacitor e React Web) para
      controle de hidratação diária. Sistema totalmente offline, persistência de
      dados local.
    technologies:
      - TypeScript
      - React
      - Capacitor
    link: https://hydropush-app.vercel.app
  - name: SECURE FLAG (CTF)
    description: Site fictício usado como alvo para desafios de cibersegurança
      forense. Projeto educativo acadêmico.
    technologies:
      - TypeScript
      - Cibersegurança
    link: https://secure-flag-projeto-ctf.vercel.app
  - name: PHOTO-TEST-ENGINE
    description: Ambiente de desenvolvimento (IDE) ultrarrápido rodando direto no
      navegador. Permite testar, visualizar e desenvolver componentes React
      (TSX/JSX) de maneira instantânea e isolada.
    technologies:
      - TypeScript
      - React
    link: https://photo-test-engine.vercel.app/
  - name: BANCO SIC MUNDUS
    description: Terminal contábil retrô e misterioso. A lógica de transações em
      Linguagem C roda no navegador via WebAssembly (WASM) integrada a uma
      interface hacker clássica CRT.
    technologies:
      - TypeScript
      - React 19
      - C
      - WebAssembly (WASM)
    link: https://banco-sic-mundus.vercel.app/
  - name: TRYMON OS
    description: Projeto experimental explorando como sistemas operacionais podem
      ser estruturados dentro de um navegador. Ambiente seguro para execução de
      binários isolados (Microkernel em Rust).
    technologies:
      - Rust
      - TypeScript
      - WebAssembly
    link: https://trymon-os.vercel.app/
  - name: WHISPER VALLEY REBUILD
    description: Uma reconstrução expandida e modernização do projeto original
      Whisper Valley. Desenvolvido como iniciativa de preservação e continuidade
      criativa, expandindo os horizontes e a estrutura técnica do projeto base.
    technologies:
      - TypeScript
      - Game Development
      - React
    link: https://whisper-valley-rebuild.vercel.app/
  - name: SELF PANDORA GAME
    description: Um jogo de plataforma 3D psicológico, abstrato e atmosférico sobre
      autodescoberta e aceitação. Desenvolvido do zero, o jogador navega pela
      rede neural de Pandora em 33 fases baseadas em sentimentos. Apresenta
      trilhas sonoras procedurais sintetizadas em tempo real via Web Audio API.
    technologies:
      - Three.js
      - TypeScript
      - Web Audio API
      - Game Development
    link: https://self-pandora-game.vercel.app/
